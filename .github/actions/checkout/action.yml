name: Checkout
description: Checkout the repository with configurable fetch-depth

inputs:
  fetch-depth:
    description: "Git history depth (0 = full history, required for change detection / version bumps)"
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - name: 📥 Checkout
      # pinned from actions/checkout@v6.1.0
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
