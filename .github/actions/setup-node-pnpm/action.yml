name: Setup Node + pnpm
description: Install Node.js and pnpm, then install Node dependencies

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  with-retry:
    description: "Wrap pnpm install in nick-fields/retry (used by long-running build jobs)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: ⚡ Setup Node
      # pinned from actions/setup-node@v6.5.0
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ inputs.node-version }}

    - name: 📦 Setup pnpm
      # pinned from pnpm/action-setup@v6.0.9
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

    - name: 📦 Install Node dependencies
      if: inputs.with-retry != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 📦 Install Node dependencies (with retry)
      if: inputs.with-retry == 'true'
      # pinned from nick-fields/retry@v4.0.0
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 5
        max_attempts: 4
        retry_wait_seconds: 30
        command: pnpm install --frozen-lockfile
