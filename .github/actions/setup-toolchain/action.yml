name: Setup full toolchain
description: Checkout + Node 24 + pnpm + uv 3.13 + Task (the standard five-step CI bootstrap)

inputs:
  node-version:
    description: "Node.js version (defaults to 24)"
    required: false
    default: "24"
  python-version:
    description: "Python version pin (defaults to 3.13)"
    required: false
    default: "3.13"
  with-retry:
    description: "Wrap pnpm install in nick-fields/retry (used by long-running build jobs)"
    required: false
    default: "false"
  fetch-depth:
    description: "Git fetch depth passed to the checkout step"
    required: false
    default: "0"

runs:
  using: composite
  # Pre-requisite: the calling workflow MUST run a direct `actions/checkout`
  # (with the desired `fetch-depth`) as the FIRST step of the job. Composite
  # actions cannot be the first step in a job because the runner needs the
  # repository checked out before it can resolve this `action.yml` — and
  # this very file lives in that not-yet-checked-out path. Treat the first
  # step of every job using this action as an explicit
  # `actions/checkout@<sha>` call; this composite only owns the four steps
  # after the checkout (Node + pnpm + uv + Task).
  steps:
    - name: ⚡📦 Setup Node + pnpm
      uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: ${{ inputs.node-version }}
        with-retry: ${{ inputs.with-retry }}

    - name: ⚡🔨 Setup uv + Task
      uses: ./.github/actions/setup-uv-task
      with:
        python-version: ${{ inputs.python-version }}
