# Dependabot — keeps GitHub Actions, Python deps, Node tooling, and Docker
# base images current. Each updater runs weekly with a coordinated
# open-PR-per-ecosystem policy.
version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────
  # Two directories on purpose: "/" covers .github/workflows/*; the
  # "/.github/actions/*" glob covers the composite actions, whose pinned SHAs
  # Dependabot does NOT discover from the workflows that merely reference them
  # (dependabot-core#6704 — the directory holding action.yml must be listed).
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "⬆️ build(deps):"
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── Python (uv) ───────────────────────────────────────────────────
  # `uv`, not `pip`: the uv ecosystem maintains uv.lock natively, so the
  # lockfile and manifest stay in sync without a manual `uv lock` follow-up.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python:uv"
    commit-message:
      prefix: "⬆️ build(deps):"
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      # Patch + minor updates bundle together; major bumps open individually.
      python-minor:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── npm (pnpm) ───────────────────────────────────────────────────
  # Only ONE directory is configured on purpose: "/".
  #
  # This workspace is a pnpm monorepo (pnpm-workspace.yaml globs apps/* and
  # packages/*) but it has a single lockfile, /pnpm-lock.yaml. A Dependabot
  # npm entry pointing at "/" already resolves every workspace member —
  # including /apps/docs and /packages/typescript-config — and updates that
  # single root lockfile, so root-only is sufficient coverage.
  #
  # Do NOT re-add an "/apps/*" entry. That entry is treated as an independent
  # manifest with its own directory-scoped lockfile: it rewrites
  # apps/docs/package.json without touching /pnpm-lock.yaml, which makes
  # `pnpm install --frozen-lockfile` fail with ERR_PNPM_OUTDATED_LOCKFILE in
  # CI. It also duplicates every /apps/docs bump the root entry already
  # produces. One directory, one lockfile, one PR per update group.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "⬆️ build(deps):"
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── Docker base image ─────────────────────────────────────────────
  # Bumps the `python:3.13-slim` base image digest in the root Dockerfile
  # (consumed by both the `nonebot` service and the `smoke-test` profile).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "⬆️ build(deps):"
    cooldown:
      default-days: 3
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Keep Docker's Python base image on the 3.13 line, while skipping
      # versions at or below 3.13.15. Thus 3.13.16+ is eligible for bumps.
      - dependency-name: "python"
        versions:
          - ">= 3.14"
          - "<= 3.13.15"
