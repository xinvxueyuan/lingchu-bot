# Dependabot — keeps GitHub Actions, Python deps, Node tooling, and Docker
# base images current. Each updater runs weekly with a coordinated
# open-PR-per-ecosystem policy.
version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────
  # Pin updates for workflow dependencies. Most actions are pinned by SHA
  # in the workflows; Dependabot will open PRs to bump the SHAs (and the
  # inline `# pinned from <repo>@<tag>` comments document the provenance).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "⬆️ build(deps):"
    groups:
      github-actions:
        patterns:
          - "*"

  # ── Python (uv) ───────────────────────────────────────────────────
  # Tracks the NoneBot plugin's runtime + dev dependencies. The root
  # pyproject.toml is the single source of truth; uv.lock is updated by
  # the `uv lock` step in the post-update command so the lockfile and
  # manifest stay in sync.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "⬆️ build(deps):"
    groups:
      # Patch + minor updates bundle together; major bumps open individually.
      python-minor:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # ── npm (pnpm) ───────────────────────────────────────────────────
  # Only ONE directory is configured on purpose: "/".
  #
  # This workspace is a pnpm monorepo (pnpm-workspace.yaml globs apps/* and
  # packages/*) but it has a single lockfile, /pnpm-lock.yaml. A Dependabot
  # npm entry pointing at "/" already resolves every workspace member —
  # including /apps/docs and /packages/typescript-config — and updates that
  # single root lockfile, so root-only is sufficient coverage.
  #
  # Do NOT re-add an "/apps/*" entry. That entry is treated as an independent
  # manifest with its own directory-scoped lockfile: it rewrites
  # apps/docs/package.json without touching /pnpm-lock.yaml, which makes
  # `pnpm install --frozen-lockfile` fail with ERR_PNPM_OUTDATED_LOCKFILE in
  # CI. It also duplicates every /apps/docs bump the root entry already
  # produces. One directory, one lockfile, one PR per update group.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "⬆️ build(deps):"
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # ── Docker base image ─────────────────────────────────────────────
  # Bumps the `python:3.13-slim` base image digest in the root Dockerfile
  # (consumed by both the `nonebot` service and the `smoke-test` profile).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "⬆️ build(deps):"
    ignore:
      # Keep Docker's Python base image on the 3.13 line, while skipping
      # versions at or below 3.13.15. Thus 3.13.16+ is eligible for bumps.
      - dependency-name: "python"
        versions:
          - ">= 3.14"
          - "<= 3.13.15"
