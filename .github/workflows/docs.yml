name: 📚 Docs Deploy
on:
  push:
    branches:
      - main
      - dev
    paths:
      - apps/docs/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/docs.yml
permissions:
  contents: read
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    name: 📦 Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        # setup-toolchain is a local composite action and cannot be the
        # first step in a job — the runner needs the repo on disk before
        # it can resolve this composite's `action.yml`.
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔨 Setup full toolchain
        # Docs build needs Node + pnpm + uv + Task.
        uses: ./.github/actions/setup-toolchain
        with:
          with-retry: "true"

      - name: Markdown Lint
        run: pnpm exec markdownlint-cli2

      - name: Lint
        run: pnpm --filter docs lint

      - name: Test
        run: pnpm --filter docs test

      - name: Type Check
        run: pnpm --filter docs check-types

      - name: Build
        run: pnpm --filter docs build

      - name: 📦 Upload docs build artifacts
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-dist-${{ github.sha }}
          path: apps/docs/dist
          if-no-files-found: error

  # ── Docs Smoke Test ──
  # Serves the statically exported docs site and verifies that the homepage
  # responds with HTTP 200 before any deployment is attempted.
  docs-smoke:
    name: 🚬 Docs smoke test
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: ⚡📦 Setup Node + pnpm
        # docs-smoke only needs Node 24 + pnpm to run `npx serve`; no uv / Task
        # required for the smoke test itself.
        uses: ./.github/actions/setup-node-pnpm

      - name: 📦 Download docs build artifacts
        # pinned from actions/download-artifact@v7.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: docs-dist-${{ github.sha }}
          path: apps/docs/dist

      - name: 🚬 Serve and verify homepage
        shell: bash
        run: |
          npx --yes serve -s apps/docs/dist -l 3000 --no-clipboard &
          server_pid=$!
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
              echo "Docs site homepage is reachable (HTTP 200)"
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "Docs site homepage did not become reachable"
          kill "$server_pid" 2>/dev/null || true
          exit 1

  deploy:
    name: 🚀 文档部署
    needs: [build, docs-smoke]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: 配置 Pages
        # pinned from actions/configure-pages@v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: 📦 Download docs build artifacts
        # pinned from actions/download-artifact@v7.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: docs-dist-${{ github.sha }}
          path: apps/docs/dist

      - name: 上传 Pages 产物
        # pinned from actions/upload-pages-artifact@v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apps/docs/dist

      - name: 部署到 Pages
        # pinned from actions/deploy-pages@v5.0.0
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        id: deployment
