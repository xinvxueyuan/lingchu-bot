name: 🧪 Frontend CI

on:
  pull_request:
    branches:
      [main, dev, "dev**", "releases/**", "feature/**", "fix/**", "hotfix/*"]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.mts"
      - "**.mjs"
      - "**.mdx"
      - "**.css"
      - "**.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/frontend.yml"
      - ".github/actions/detect-changes/**"
  push:
    branches: [main, dev]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.mts"
      - "**.mjs"
      - "**.mdx"
      - "**.css"
      - "**.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/frontend.yml"
      - ".github/actions/detect-changes/**"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Change Detection ──────────────────────────────────────────────
  # 颗粒度化：检测前端变更文件类型，按需触发下游 job
  # 逻辑与 .husky/pre-commit v3 保持一致，共享 .github/actions/detect-changes
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      frontend-code: ${{ steps.detect.outputs.frontend-code }}
      frontend-style: ${{ steps.detect.outputs.frontend-style }}
      frontend-content: ${{ steps.detect.outputs.frontend-content }}
      frontend-mdx: ${{ steps.detect.outputs.frontend-mdx }}
      frontend-tsx: ${{ steps.detect.outputs.frontend-tsx }}
    steps:
      - name: 📥 Checkout
        # 本地 composite action (`./.github/actions/detect-changes`) 在
        # `uses:` 解析时就需要 action.yml，必须先 checkout。
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/detect-changes

  docs-check:
    name: 📚 Docs Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        # setup-toolchain is a local composite action and cannot be the
        # first step in a job — the runner needs the repo on disk before
        # it can resolve this composite's `action.yml`.
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: 🔨 Setup full toolchain
        # Docs Check needs Node + pnpm + uv + Task to mirror the local dev
        # loop (`pnpm --filter docs …`).
        uses: ./.github/actions/setup-toolchain
      - name: ESLint
        # 对齐 pre-commit v3 NEEDS_LINT：代码/样式/配置/MDX 内容变更触发（纯 .json 内容跳过）
        if: needs.changes.outputs.frontend-code == 'true' || needs.changes.outputs.frontend-style == 'true' || needs.changes.outputs.frontend-mdx == 'true'
        run: pnpm --filter docs lint
      - name: Type Check
        # 对齐 pre-commit v3 NEEDS_TYPE_CHECK：任意前端变更触发（Astro content collections 和 CSS 可能影响类型）
        run: pnpm --filter docs check-types
      - name: Test
        # 对齐 pre-commit v3 NEEDS_DOCS_TEST：代码/内容/配置变更触发（纯 .css 样式跳过）
        if: needs.changes.outputs.frontend-code == 'true' || needs.changes.outputs.frontend-content == 'true'
        run: pnpm --filter docs test
