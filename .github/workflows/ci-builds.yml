name: 👷 CI-builds

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "dev*"
      - "releases/**"
      - "feature/**"
      - "fix/**"
      - "hotfix/*"
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "Taskfile.yml"
      - "**/*.py"
      - "**/LICENSE*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "apps/docs/**"
      - "packages/**"
      - ".github/workflows/ci-builds.yml"
  push:
    branches:
      - main
      - "dev*"
      - "releases/**"
      - "feature/**"
      - "fix/**"
      - "hotfix/*"
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "Taskfile.yml"
      - "**/*.py"
      - "**/LICENSE*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "apps/docs/**"
      - "packages/**"
      - ".github/workflows/ci-builds.yml"

permissions:
  contents: read

concurrency:
  group: ci-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !startsWith(github.ref, 'refs/heads/main') &&
       !startsWith(github.ref, 'refs/heads/dev'))
    permissions:
      contents: read

    steps:
      - name: 🔨 Setup full toolchain
        # Composite action chains checkout + Node 24 + pnpm + uv 3.13 + Task.
        # `with-retry: true` wraps `pnpm install` so transient network errors
        # don't fail long-running build jobs.
        uses: ./.github/actions/setup-toolchain
        with:
          with-retry: "true"

      - name: 📦 Build
        run: task ci:build

      - name: 🔍 Verify wheel contents
        uses: ./.github/actions/verify-wheel

      - name: 📦 Archive build artifacts
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assets-${{ github.sha }}
          path: dist
          if-no-files-found: error

  # ── Smoke Test ──
  # Runs the containerized smoke test suite against the freshly built
  # distribution artifacts. This validates startup, hook registration and
  # core service initialization without requiring a real OneBot connection.
  smoke-test:
    name: 🚬 Smoke test
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        # Direct `actions/checkout` (not the local composite) — the
        # composite checkout action cannot be the first step in a job
        # because the runner needs the repo checked out before it can
        # resolve `./.github/actions/checkout`.
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: 📦 Download build artifacts
        # pinned from actions/download-artifact@v7.0.0
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: assets-${{ github.sha }}
          path: dist

      - name: 🐳 Build smoke image
        run: docker build --build-arg SMOKE_TEST=true -t lingchu-bot:smoke .

      - name: 🚬 Run smoke tests
        run: |
          mkdir -p test-results/smoke
          docker run --rm --user root \
            -e SMOKE_TEST=true \
            -e SMOKE_TEST_RESULTS_XML=/reports/smoke-test-results.xml \
            -v "$PWD/test-results/smoke:/reports" \
            lingchu-bot:smoke

      - name: 📤 Upload smoke test report on failure
        if: failure()
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smoke-test-results-${{ github.sha }}
          path: test-results/smoke/smoke-test-results.xml
          if-no-files-found: ignore

  # ── Smoke Test (Prod Env, non-Docker) ──
  # Validates that the bot starts with ENVIRONMENT=prod on a pristine runner
  # (no Docker, no pre-existing localstore), proving startup is schema-write-free
  # and survives a clean environment. Complements the Docker-based smoke-test job
  # and implements Stage 2 of the documented three-stage smoke test flow.
  smoke-test-prod-env:
    name: 🚬 Smoke test (prod-env)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
    env:
      ENVIRONMENT: prod
      LOCALSTORE_USE_CWD: "true"
      DRIVER: "~fastapi+~httpx+~websockets"
      LINGCHU_ADAPTER: "~onebot.v11"
      LINGCHU_SUPERUSERS: '{"smoke_user":{"qq":"42"}}'
      LINGCHU_LOCALE: zh_CN
      ALEMBIC_STARTUP_CHECK: "false"

    steps:
      - name: 📥 Checkout
        # setup-uv-task (used below) does NOT include checkout, so this
        # first step must be a direct `actions/checkout` call. The
        # removed composite `.github/actions/checkout` cannot be the
        # first step in a job.
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: 🔨 Setup uv + Task
        # prod-env smoke only needs uv (no Node, no pnpm).
        uses: ./.github/actions/setup-uv-task

      - name: 📦 Install dependencies
        run: uv sync --frozen

      - name: 🚬 Run prod-env smoke test
        shell: bash
        run: |
          set -euo pipefail
          # Start the bot with ENVIRONMENT=prod on a pristine runner.
          # timeout kills the process after 60s (exit 124); the || true
          # prevents that from failing the step — the grep below is the
          # actual pass/fail gate.
          timeout 60s uv run nb run -r > /tmp/nb-output.log 2>&1 || true
          cat /tmp/nb-output.log
          if grep -q "Application startup complete." /tmp/nb-output.log; then
            echo "✓ Application startup complete marker detected"
            exit 0
          else
            echo "✗ Application startup complete marker NOT detected within 60s"
            exit 1
          fi

  versioned-build:
    name: 🔖 Versioned build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/heads/main') ||
       startsWith(github.ref, 'refs/heads/dev'))
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: 🔨 Setup full toolchain
        # versioned-build needs full history (fetch-depth: 0) for `git fetch
        # --tags` inside ci:version:bump, plus the same Node 24 + pnpm + uv +
        # Task chain for the actual `task ci:build` step.
        uses: ./.github/actions/setup-toolchain
        with:
          with-retry: "true"
          fetch-depth: "0"

      - name: 🔖 Derive bump from branch
        id: derive
        # ci:version:derive-bump is the single source of truth for the seven
        # release bumps; the same task is called by release.yml, release:prepare,
        # and release:notes. Push events always run on main / dev* branches.
        shell: bash
        run: |
          set -euo pipefail
          task -s ci:version:derive-bump SOURCE="${GITHUB_REF_NAME}"

      - name: 🔖 Bump development version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          task ci:version:bump \
            BUMP_LEVEL="${{ steps.derive.outputs.bump_level }}" \
            BUMP_PRERELEASE="${{ steps.derive.outputs.bump_prerelease }}"

      - name: ✅ Pre-check version
        shell: bash
        run: task ci:version:precheck NEW_VERSION="${{ steps.bump.outputs.new_version }}"

      - name: 🏷️ Write version to config.py
        shell: bash
        run: task ci:version:write-config
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          CONFIG_PATH: src/plugins/nonebot_plugin_lingchu_bot/core/config.py

      - name: ✅ Post-check version
        shell: bash
        run: task ci:version:postcheck VERSION="${{ steps.bump.outputs.new_version }}"

      - name: 📦 Build
        run: task ci:build

      - name: 🔍 Verify wheel contents
        uses: ./.github/actions/verify-wheel

      - name: 🛡️ Attest build provenance
        uses: ./.github/actions/attest-slsa
        with:
          subject-path: dist/*

      - name: 📦 Archive production artifacts
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assets-${{ steps.bump.outputs.new_version }}
          path: dist
          if-no-files-found: error

      - name: 🏷️ Create version tag
        shell: bash
        run: task ci:version:tag-only VERSION="${{ steps.bump.outputs.new_version }}"

  # ── Smoke Test (Versioned) ──
  smoke-test-versioned:
    name: 🚬 Smoke test (versioned)
    runs-on: ubuntu-latest
    needs: versioned-build
    if: ${{ needs.versioned-build.result == 'success' }}
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: 📦 Download versioned build artifacts
        # pinned from actions/download-artifact@v7.0.0
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: assets-${{ needs.versioned-build.outputs.new_version }}
          path: dist

      - name: 🐳 Build smoke image
        run: docker build --build-arg SMOKE_TEST=true -t lingchu-bot:smoke-versioned .

      - name: 🚬 Run smoke tests
        run: |
          mkdir -p test-results/smoke
          docker run --rm --user root \
            -e SMOKE_TEST=true \
            -e SMOKE_TEST_RESULTS_XML=/reports/smoke-test-results.xml \
            -v "$PWD/test-results/smoke:/reports" \
            lingchu-bot:smoke-versioned

      - name: 📤 Upload smoke test report on failure
        if: failure()
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smoke-test-results-versioned-${{ github.sha }}
          path: test-results/smoke/smoke-test-results.xml
          if-no-files-found: ignore
