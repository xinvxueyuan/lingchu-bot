name: 🎭 Playwright

on:
  pull_request:
    branches:
      [main, dev, "dev**", "feature/**", "fix/**", "hotfix/*"]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/playwright.yml"
  push:
    branches: [main, dev]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/playwright.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  playwright:
    name: 🎭 Docs E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        # setup-toolchain is a local composite action and cannot be the
        # first step in a job — the runner needs the repo on disk before
        # it can resolve this composite's `action.yml`.
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔨 Setup full toolchain
        # Playwright needs Node + pnpm + uv + Task to mirror the local
        # `pnpm --filter docs test:e2e` flow.
        uses: ./.github/actions/setup-toolchain

      - name: Cache Playwright browsers
        # pinned from actions/cache@v6.0.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/docs/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        # 原生 run + 25 分钟上限。此前用 nick-fields/retry：安装 `--with-deps`
        # 实测超过其 10 分钟上限，超时时该 action 的 killAll 抛 `kill EPERM`
        # 直接判错，`max_attempts: 3` 一次都没执行（连续两次 CI 都这样红）。
        timeout-minutes: 25
        run: pnpm --filter docs exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm --filter docs run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: apps/docs/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-test-results
          path: apps/docs/test-results/
          retention-days: 7
