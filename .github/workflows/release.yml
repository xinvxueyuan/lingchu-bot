name: 🚀 Release

on:
  push:
    branches:
      - "releases/major"
      - "releases/minor"
      - "releases/patch"
      - "releases/stable"
      - "releases/alpha"
      - "releases/beta"
      - "releases/rc"
  workflow_dispatch:
    inputs:
      bump:
        description: "Release bump (major / minor / patch / stable / alpha / beta / rc)"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
          - stable
          - alpha
          - beta
          - rc

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: 🔎 Validate release input
    runs-on: ubuntu-latest
    outputs:
      bump_level: ${{ steps.derive.outputs.bump_level }}
      bump_prerelease: ${{ steps.derive.outputs.bump_prerelease }}
      version: ${{ steps.bump.outputs.new_version }}
      notes_body_path: ${{ steps.notes.outputs.body_path }}
    steps:
      - name: 🔨 Setup uv + Task
        # Derive needs uv + Task to call ci:version:derive-bump + ci:version:bump.
        uses: ./.github/actions/setup-uv-task

      - name: 🔖 Derive bump from branch or dispatch input
        id: derive
        # ci:version:derive-bump is the single source of truth for the seven
        # release bumps; the same task is called by ci-builds.yml, release:prepare,
        # and release:notes. Refs GITHUB_REF_NAME for push events and the
        # `bump` dispatch input for manual runs.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            source="${{ github.event.inputs.bump }}"
          else
            source="${GITHUB_REF_NAME}"
          fi
          task -s ci:version:derive-bump SOURCE="$source"

      - name: 🔖 Bump release version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          task ci:version:bump \
            BUMP_LEVEL="${{ steps.derive.outputs.bump_level }}" \
            BUMP_PRERELEASE="${{ steps.derive.outputs.bump_prerelease }}"

      - name: ✅ Pre-check version
        shell: bash
        run: task ci:version:precheck NEW_VERSION="${{ steps.bump.outputs.new_version }}"

      - name: 🏷️ Write version to source files
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          CONFIG_PATH: src/plugins/nonebot_plugin_lingchu_bot/core/config.py
        run: task ci:version:write-config

      - name: ✅ Post-check version
        shell: bash
        run: task ci:version:postcheck VERSION="${{ steps.bump.outputs.new_version }}"

      - name: 📝 Locate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.new_version }}"
          notes_path=".github/releases/${version}.md"
          if [ ! -f "$notes_path" ]; then
            echo "::error::Missing release notes: ${notes_path}"
            echo "Create the file (run \`task release:notes\` on a releases/<bump> branch) and push before re-running."
            exit 1
          fi
          body_path="${RUNNER_TEMP}/release-notes-${version}.md"
          cp "$notes_path" "$body_path"
          echo "body_path=$body_path" >> "$GITHUB_OUTPUT"

  build:
    name: 📦 Build artifacts
    runs-on: ubuntu-latest
    needs: validate
    # contents: write is required to amend the release branch with the
    # version that `ci:version:write-config` just produced, so the tag
    # and the source files stay in sync.
    permissions:
      contents: write
    steps:
      - name: 🔨 Setup full toolchain
        # Composite action chains checkout + Node 24 + pnpm + uv 3.13 + Task
        # in a single step. `with-retry: true` wraps `pnpm install` so transient
        # network errors don't fail long-running build jobs.
        uses: ./.github/actions/setup-toolchain
        with:
          with-retry: "true"

      - name: 🔄 Sync version files to release branch
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          if git diff --quiet HEAD -- pyproject.toml package.json src/plugins/nonebot_plugin_lingchu_bot/core/config.py; then
            echo "No version drift between branch and CI; skipping amend."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml package.json src/plugins/nonebot_plugin_lingchu_bot/core/config.py
            git commit -m "🔧 chore(release): 同步 ${version} 版本文件" \
              --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 🧹 Remove non-distribution infrastructure
        run: bash scripts/clean-release-infra.sh

      - name: 📦 Build
        run: task ci:build

      - name: 🔍 Verify wheel contents
        uses: ./.github/actions/verify-wheel

      - name: 📤 Upload dist
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dist-${{ needs.validate.outputs.version }}
          path: dist
          if-no-files-found: error

  publish-pypi:
    name: 🐍 Publish PyPI
    runs-on: ubuntu-latest
    needs: [validate, build]
    # PyPI Trusted Publishing (OIDC) requires id-token: write;
    # attestations: write for SLSA Build L3 provenance.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: 📥 Download dist
        # pinned from actions/download-artifact@v7.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dist-${{ needs.validate.outputs.version }}
          path: dist

      - name: 🛡️ Attest build provenance
        uses: ./.github/actions/attest-slsa
        with:
          subject-path: dist/*

      - name: 📦 Publish to PyPI
        # pinned from pypa/gh-action-pypi-publish@release/v1
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247

  publish-image:
    name: 🐳 Publish GHCR image
    runs-on: ubuntu-latest
    needs: [validate, build]
    # GHCR push requires packages: write;
    # id-token: write + attestations: write for SLSA Build L3 provenance.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: 📥 Checkout
        uses: ./.github/actions/checkout

      - name: 🧹 Remove non-distribution infrastructure
        run: bash scripts/clean-release-infra.sh

      - name: 🔧 Setup Docker buildx
        # pinned from docker/setup-buildx-action@v3.12.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: 🔐 Login to GHCR
        # pinned from docker/login-action@v3.7.0
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker metadata (stable)
        id: meta-stable
        if: needs.validate.outputs.bump_prerelease == 'stable'
        # pinned from docker/metadata-action@v5.10.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=${{ needs.validate.outputs.version }%.*}
            type=raw,value=latest

      - name: 🏷️ Docker metadata (pre-release)
        id: meta-prerelease
        if: needs.validate.outputs.bump_prerelease != 'stable'
        # pinned from docker/metadata-action@v5.10.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=${{ needs.validate.outputs.version }}%.*

      - name: 🐳 Build and push
        id: build
        # pinned from docker/build-push-action@v6.19.2
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: ${{ steps.meta-stable.outputs.tags || steps.meta-prerelease.outputs.tags }}
          labels: ${{ steps.meta-stable.outputs.labels || steps.meta-prerelease.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            VCS_REF=${{ github.sha }}

  github-release:
    name: 🏷️ GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish-pypi, publish-image]
    # Creating GitHub release tags requires contents: write.
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        # The tag-only task shells out to `git tag` / `git push`; full history
        # is needed so we can verify a tag doesn't already exist locally.
        uses: ./.github/actions/checkout
        with:
          fetch-depth: 0

      - name: 🔨 Setup uv + Task
        # github-release only needs uv + Task (no Node, no pnpm).
        uses: ./.github/actions/setup-uv-task

      - name: 🏷️ Create tag
        run: task ci:version:tag-only VERSION="${{ needs.validate.outputs.version }}"

      - name: 📥 Download dist
        # pinned from actions/download-artifact@v7.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dist-${{ needs.validate.outputs.version }}
          path: dist

      - name: 🚀 Create GitHub Release
        # pinned from softprops/action-gh-release@v2.6.2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Lingchu Bot v${{ needs.validate.outputs.version }}
          files: dist/*
          body_path: ${{ needs.validate.outputs.notes_body_path }}
