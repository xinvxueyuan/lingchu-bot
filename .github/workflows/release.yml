name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release bump (major / minor / patch / stable / alpha / beta / rc)"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
          - stable
          - alpha
          - beta
          - rc

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: 🔎 Validate release input
    runs-on: ubuntu-latest
    outputs:
      bump_level: ${{ steps.derive.outputs.bump_level }}
      bump_prerelease: ${{ steps.derive.outputs.bump_prerelease }}
      version: ${{ steps.bump.outputs.new_version }}
      # Strip the patch segment via bash parameter expansion so the docker
      # metadata action can tag `0.4.0` images as `0.4` without leaning on
      # GitHub Actions expression syntax (which does not support `%`).
      minor_version: ${{ steps.tag.outputs.minor_version }}
      notes_body_path: ${{ steps.notes.outputs.body_path }}
    steps:
      - name: 📥 Checkout
        # setup-uv-task is a local composite action and cannot be the first
        # step in a job — the runner needs the repo on disk before it can
        # resolve this composite's `action.yml`. Explicit checkout first.
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔨 Setup uv + Task
        # Derive needs uv + Task to call ci:version:derive-bump + ci:version:bump.
        uses: ./.github/actions/setup-uv-task

      - name: 🔖 Derive bump from dispatch input
        id: derive
        # ci:version:derive-bump is the single source of truth for the seven
        # release bumps; the same task is called by ci-builds.yml, release:prepare,
        # and release:notes. Manual-only trigger: the `bump` dispatch input is
        # the sole source for the release level.
        shell: bash
        run: |
          set -euo pipefail
          task -s ci:version:derive-bump SOURCE="${{ github.event.inputs.bump }}"

      - name: 🔖 Bump release version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          task ci:version:bump \
            BUMP_LEVEL="${{ steps.derive.outputs.bump_level }}" \
            BUMP_PRERELEASE="${{ steps.derive.outputs.bump_prerelease }}"

      - name: 🏷️ Derive minor version tag
        id: tag
        shell: bash
        # Bash parameter expansion drops the last `.X` segment, so
        # `0.4.0` -> `0.4` and `0.4.0a1` -> `0.4` (the rightmost dot is
        # between `4` and `0`, so the pre-release suffix is preserved
        # only when the patch segment is missing).
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.new_version }}"
          minor="${version%.*}"
          echo "minor_version=${minor}" >> "$GITHUB_OUTPUT"
          echo "Resolved minor_version=${minor} from ${version}"

      - name: ✅ Pre-check version
        shell: bash
        run: task ci:version:precheck NEW_VERSION="${{ steps.bump.outputs.new_version }}"

      - name: 🏷️ Write version to source files
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          CONFIG_PATH: src/plugins/nonebot_plugin_lingchu_bot/core/config.py
        run: task ci:version:write-config

      - name: ✅ Post-check version
        shell: bash
        run: task ci:version:postcheck VERSION="${{ steps.bump.outputs.new_version }}"

      - name: 📝 Locate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.new_version }}"
          notes_path=".github/releases/${version}.md"
          if [ ! -f "$notes_path" ]; then
            echo "::error::Missing release notes: ${notes_path}"
            echo "Create the file (run \`task release:prepare BUMP=...\` on the dispatch branch) and push before re-running."
            exit 1
          fi
          body_path="${RUNNER_TEMP}/release-notes-${version}.md"
          cp "$notes_path" "$body_path"
          echo "body_path=$body_path" >> "$GITHUB_OUTPUT"

  build:
    name: 📦 Build artifacts
    runs-on: ubuntu-latest
    needs: validate
    # contents: write is required to sync the dispatch branch with the
    # version that `ci:version:write-config` just produced, so the tag
    # and the source files stay in sync.
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        # setup-toolchain is a local composite action and cannot be the
        # first step in a job — the runner needs the repo on disk before
        # it can resolve this composite's `action.yml`.
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔨 Setup full toolchain
        # Composite action chains Node 24 + pnpm + uv 3.13 + Task
        # in a single step. `with-retry: true` wraps `pnpm install` so transient
        # network errors don't fail long-running build jobs.
        # `enable-uv-cache: true` is required because `task ci:build`
        # runs `uv build`, which populates the uv cache that setup-uv
        # tries to save.
        uses: ./.github/actions/setup-toolchain
        with:
          with-retry: "true"
          enable-uv-cache: "true"

      - name: 🔄 Write CI-derived version and sync to dispatch branch
        # The version is derived by `ci:version:bump` from the latest tag via
        # `uv version --bump` (single source of truth). The developer never
        # writes version files — this step writes the derived version into the
        # tree, commits it to the dispatch branch (main), and the build below
        # produces artifacts that carry it.
        # `--no-sync` (not `--frozen`) so uv.lock's project version follows
        # pyproject.toml; `//:wheel-smoke` runs `uv run --locked` and would
        # otherwise fail on the version mismatch.
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          uv version "$version" --no-sync
          VERSION="$version" \
            CONFIG_PATH="src/plugins/nonebot_plugin_lingchu_bot/core/config.py" \
            task ci:version:write-config
          if git diff --quiet HEAD -- pyproject.toml uv.lock package.json src/plugins/nonebot_plugin_lingchu_bot/core/config.py; then
            echo "Version files already in sync; skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml uv.lock package.json src/plugins/nonebot_plugin_lingchu_bot/core/config.py
            git commit --no-verify -m "🔧 chore(release): 同步 ${version} 版本文件" \
              --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 📦 Build
        run: task ci:build

      - name: 🔍 Verify wheel contents
        uses: ./.github/actions/verify-wheel

      - name: 📤 Upload dist
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dist-${{ needs.validate.outputs.version }}
          path: dist
          if-no-files-found: error

  publish-pypi:
    name: 🐍 Publish PyPI
    runs-on: ubuntu-latest
    needs: [validate, build]
    # Must match the PyPI Trusted Publisher "Environment name" (pypi): the
    # OIDC token only carries the `environment` claim when the job declares
    # an environment, and PyPI rejects the exchange if it expects one the
    # token does not have (`invalid-publisher`). GitHub auto-creates the
    # `pypi` environment on first reference.
    environment: pypi
    # PyPI Trusted Publishing (OIDC) requires id-token: write;
    # attestations: write for SLSA Build L3 provenance.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: 📥 Checkout
        # attest-slsa is a local composite action and cannot run without the
        # repo on disk — the runner needs the tree before it can resolve
        # this composite's `action.yml`. Explicit checkout first.
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 📥 Download dist
        # pinned from actions/download-artifact@v7.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dist-${{ needs.validate.outputs.version }}
          path: dist

      - name: 🛡️ Attest build provenance
        uses: ./.github/actions/attest-slsa
        with:
          subject-path: dist/*

      - name: 📦 Publish to PyPI
        # pinned from pypa/gh-action-pypi-publish@release/v1
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  publish-image:
    name: 🐳 Publish GHCR image
    runs-on: ubuntu-latest
    needs: [validate, build]
    # GHCR push requires packages: write;
    # id-token: write + attestations: write for SLSA Build L3 provenance.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🧹 Remove non-distribution infrastructure
        run: bash scripts/clean-release-infra.sh

      - name: 🔧 Setup Docker buildx
        # pinned from docker/setup-buildx-action@v3.12.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: 🔐 Login to GHCR
        # pinned from docker/login-action@v3.7.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker metadata (stable)
        id: meta-stable
        if: needs.validate.outputs.bump_prerelease == 'stable'
        # pinned from docker/metadata-action@v5.10.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=${{ needs.validate.outputs.minor_version }}
            type=raw,value=latest

      - name: 🏷️ Docker metadata (pre-release)
        id: meta-prerelease
        if: needs.validate.outputs.bump_prerelease != 'stable'
        # pinned from docker/metadata-action@v5.10.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=${{ needs.validate.outputs.minor_version }}

      - name: 🐳 Build and push
        id: build
        # pinned from docker/build-push-action@v6.19.2
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: ${{ steps.meta-stable.outputs.tags || steps.meta-prerelease.outputs.tags }}
          labels: ${{ steps.meta-stable.outputs.labels || steps.meta-prerelease.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            VCS_REF=${{ github.sha }}

  github-release:
    name: 🏷️ GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish-pypi, publish-image]
    # Creating GitHub release tags requires contents: write.
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        # The tag-only task shells out to `git tag` / `git push`; full history
        # is needed so we can verify a tag doesn't already exist locally.
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push tags whose tree differs in
          # .github/workflows/** from branch tips (workflows permission is
          # reserved for PATs). Use a fine-grained PAT so the tag push in
          # ci:version:tag-only succeeds even after workflow merges.
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: 🔨 Setup uv + Task
        # github-release only needs uv + Task (no Node, no pnpm).
        uses: ./.github/actions/setup-uv-task

      - name: 🔄 Sync to latest dispatch branch tip
        # The build job committed the CI-derived version files to the dispatch
        # branch (main). Move to that tip so the tag points at the commit whose
        # tree carries the released version.
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git reset --hard origin/main
          echo "Tagging $(git rev-parse --short HEAD)"

      - name: 🏷️ Create tag
        run: task ci:version:tag-only VERSION="${{ needs.validate.outputs.version }}"

      - name: 🧬 Merge manual notes with GitHub-generated changelog
        # GitHub 的 generate-notes API 基于 PR/commit 自动生成变更说明，
        # 与 .github/releases/<version>.md 手工 notes 合并后作为 release body。
        # 必须在 Create tag 之后调用，previous-tag 推断才准确。
        # 同时修复原跨 job 引用 RUNNER_TEMP body_path 的隐患（不同 job 的
        # RUNNER_TEMP 相互隔离，原 body 文件在 github-release runner 上不存在）。
        id: auto-notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          # Target the synced commit (== the tagged commit) so generate-notes
          # uses the correct previous-tag delta.
          target_sha="$(git rev-parse HEAD)"
          auto_body="$(
            curl -sS -f -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/releases/generate-notes" \
              -d "{\"tag_name\":\"v${version}\",\"target_commitish\":\"${target_sha}\"}" \
              | jq -r .body
          )"
          manual_notes=".github/releases/${version}.md"
          if [ ! -f "${manual_notes}" ]; then
            echo "::error::Missing release notes: ${manual_notes}"
            exit 1
          fi
          merged="${RUNNER_TEMP}/merged-release-notes-${version}.md"
          {
            cat "${manual_notes}"
            printf "\n---\n\n"
            printf '%s\n' "${auto_body}"
          } > "${merged}"
          echo "body_path=${merged}" >> "$GITHUB_OUTPUT"

      - name: 📥 Download dist
        # pinned from actions/download-artifact@v7.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dist-${{ needs.validate.outputs.version }}
          path: dist

      - name: 🚀 Create GitHub Release
        # pinned from softprops/action-gh-release@v2.6.2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Lingchu Bot v${{ needs.validate.outputs.version }}
          files: dist/*
          body_path: ${{ steps.auto-notes.outputs.body_path }}
