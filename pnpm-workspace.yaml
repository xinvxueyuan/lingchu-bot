packages:
  - "apps/*"
  - "packages/*"

overrides:
  esbuild: ">=0.28.1"
  # Security fixes: caret ranges so pnpm picks up future patches within each
  # major; the lower bound is the latest known-good version.
  brace-expansion: "^5.0.8" # CVE-2026-14257 / GHSA-mh99-v99m-4gvg
  postcss: "^8.5.23" # GHSA-r28c-9q8g-f849 (sourceMappingURL path traversal)
  vite: "^8.1.5" # latest 8.x
  js-yaml: "^4.3.0" # latest 4.x
  markdown-it: "^14.3.0" # latest 14.x
  sharp: "^0.35.3" # GHSA-f88m-g3jw-g9cj (libvips)
  adm-zip: "^0.6.0" # CVE-2026-39244
  "@hono/node-server": "^2.0.11" # GHSA-frvp-7c67-39w9

allowBuilds:
  '@go-task/cli': true
  '@ladybugdb/core': true
  '@scarf/scarf': true
  esbuild: true
  gitnexus: true
  onnxruntime-node: false
  protobufjs: true
  sharp: true
  tree-sitter: true
  tree-sitter-c: true
  tree-sitter-c-sharp: true
  tree-sitter-cpp: true
  tree-sitter-go: true
  tree-sitter-java: true
  tree-sitter-javascript: true
  tree-sitter-kotlin: true
  tree-sitter-php: true
  tree-sitter-python: true
  tree-sitter-ruby: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - postcss@8.5.23
