exclude = '''(?x)^(
  skills/|
  \.agents/skills/|
  \.claude/skills/|
  \.trae/skills/|
  \.vscode/|
  apps/docs/\.astro/
)'''

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # pinned from pre-commit/pre-commit-hooks@v6.0.0
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-xml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = [
    "--maxkb=2048",
  ] },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
  { id = "mixed-line-ending", args = [
    "--fix=lf",
  ] },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "cb8c523fd4835aba42af70f4cad5568db4df0b6c"  # pinned from astral-sh/ruff-pre-commit@v0.16.0
hooks = [
  { id = "ruff", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "3940f891290063e0fde330228f5bff73e18ad2f2"  # pinned from astral-sh/ty-pre-commit@v0.0.64
hooks = [
  { id = "ty" },
]
