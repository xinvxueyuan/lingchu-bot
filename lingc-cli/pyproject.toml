[project]
name = "lingc-cli"
version = "0.1.0"
description = "A convenience command-line tool for operating and maintaining Lingchu Bot (safe startup, env detection, install/uninstall, diagnostics/repair, updates)."
readme = "README.md"
requires-python = ">=3.13, <3.14"
license = { text = "LGPL-3.0-or-later" }
keywords = ["nonebot", "lingchu", "cli", "tooling"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "anyio>=4.0",
    "noneprompt>=0.1.0",
    "watchfiles>=1.0",
    "packaging>=24.0",
]

[project.scripts]
lc = "lingc_cli.app:main"

[project.urls]
Repository = "https://github.com/xinvxueyuan/lingchu-bot"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.0",
    "pyright>=1.1.411",
    "ty>=0.0.63",
]

[tool.uv.build-backend]
module-name = ["lingc_cli"]
module-root = "src"

[build-system]
requires = ["uv_build>=0.11.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
line-ending = "lf"
preview = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
future-annotations = true
select = [
    "F", "W", "E", "I", "N", "PL", "UP", "B", "A", "COM", "C4", "D",
    "DTZ", "T10", "ICN", "PIE", "T20", "PYI", "Q", "RSE", "RET", "SIM",
    "SLOT", "TID", "TC", "ARG", "PTH", "PERF", "PGH", "FURB", "TRY", "RUF",
]
ignore = [
    "ANN201", "ANN202", "ANN401",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203", "D212", "D400", "D415",
    "FBT001", "FBT002", "FBT003",
    "B008",  # typer.Option(...) as defaults is idiomatic for CLI flags
    "COM812",
    "PLC0415",  # lazy import of optional runtime deps (nonebot/adapters) is intentional
]

[tool.ruff.lint.per-file-ignores]
# CI scripts use SystemExit messages + print for diagnostics (mirror root scripts/**).
"scripts/**" = ["T201", "C901", "PLR0915", "BLE001", "E501", "F541", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.isort]
known-first-party = ["lingc_cli"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.ty]
[tool.ty.src]
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["src"]
testpaths = ["tests"]
