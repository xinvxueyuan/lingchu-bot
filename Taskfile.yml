# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Task dependency graph (maintainer reference — kept in sync with .github/workflows/*.yml):
#
#   install                       → uv sync, pnpm install
#   up                            → uv sync --upgrade, pnpm update
#   check                         → ruff check, ruff format check, markdownlint, turbo lint, pyright, ty, turbo check-types
#   test                          → pytest, docs test
#   format                        → ruff format, prettier, markdownlint --fix
#   fix                           → ruff check --fix, ruff format, prettier, ty --fix, markdownlint --fix
#   build                         → turbo build
#   ci                            → ci:hooks → check → test → build
#   hooks:validate                → prek validate-config                                             [CI: python.yml, husky pre-commit]
#   hooks:staged                  → prek run --stage pre-commit                                      [husky pre-commit Phase 1]
#   ci:hooks                      → hooks:validate + prek run --all-files                            [CI: python.yml]
#   ci:static                     → ruff check, ruff format check, markdownlint, turbo lint          [CI: python.yml]
#   ci:typecheck                  → pyright, ty, turbo check-types                                 [local-only; CI runs pyright/ty inline]
#   ci:test                       → pytest --junitxml, docs test                                    [local-only; CI runs pytest inline]
#   ci:fix                        → ruff check --fix, ruff format, prettier, ty --fix, markdownlint --fix     [CI: python.yml]
#   ci:build                      → uv build, turbo build                                          [CI: ci-builds.yml, release.yml]
#   ci:docs                       → docs lint, docs test, docs check-types, docs build             [local-only; CI runs workflow inline]
#   smoke                         → docker compose --profile smoke up                               [docs: CONTRIBUTING.md]
#   ci:smoke                      → docker compose --profile smoke run (JUnit report)              [local-only; CI invokes docker compose inline]
#
#   Version pipeline (daily 02:00 Asia/Shanghai via ci-builds.yml versioned-build schedule job; main is stable-only):
#     ci:version:derive-bump  (BUMP_LEVEL / BUMP_PRERELEASE from branch / dispatch input — single source of truth)
#     ci:version:bump
#       → ci:version:precheck   (PEP 440, > all tags, source consistency, no duplicate tag)
#       → ci:version:write-config  (writes VERSION into core/config.py + package.json)
#       → ci:version:postcheck  (calls release:verify-version + dev release semantics)
#       → ci:build              (uv build + turbo build)
#       → actions/attest-build-provenance (SLSA, in workflow — not a task)
#       → ci:version:tag-only    (creates + pushes git tag)
#
#   Release pipeline (release.yml, manual trigger only):
#     ci:version:derive-bump  (BUMP_LEVEL / BUMP_PRERELEASE derived from the workflow_dispatch `bump` input)
#     ci:version:bump
#       → ci:version:precheck   (PEP 440, > all tags, source consistency, no duplicate tag)
#       → ci:version:write-config  (writes VERSION into core/config.py + package.json)
#       → ci:version:postcheck  (calls release:verify-version + dev release semantics)
#       → ci:build              (uv build + turbo build)
#       → actions/attest-build-provenance (SLSA, in workflow — not a task)
#       → ci:version:tag-only    (creates + pushes git tag)
#     release:verify-version    (pyproject.toml / package.json / core/config.py consistency)  [CI: release.yml, called by ci:version:postcheck]
#     ci:version:tag-only       (tag only)                                                     [CI: release.yml]
#     release:prepare           (local: preview the uv-derived version + scaffold release notes; no version write, no branch switch)
#     release:publish           (local: gh workflow run release.yml -f bump=<bump> — manual trigger)   [docs: CONTRIBUTING.md]
#     release:notes             (local: scaffold .github/releases/<computed_version>.md)        [docs: CONTRIBUTING.md]
#     ci:version:from-tag       (restore version from git tag into core/config.py)              [local-only; not invoked by current CI]
#
#   i18n                          → pybabel extract / update / compile                            [docs: AGENTS.md, CONTRIBUTING.md, README]
#   gitmoji                       → display gitmoji + Conventional Commits cheatsheet           [docs: CONTRIBUTING.md]
#
# Orphan / local-only tasks (not directly invoked by CI or docs; retained for local parity):
#   ci:typecheck, ci:test, ci:docs, ci:smoke, ci:version:from-tag, up, format, fix

version: "3"

# vars:
  # markdownlint-cli2 范围由根目录 .markdownlint-cli2.jsonc 统一驱动（globs + ignores + config）
  # 所有调用方无参调用 markdownlint-cli2，避免多处维护 glob 列表

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies
    cmds:
      - uv sync --all-extras
      - pnpm install

  up:
    desc: Update all dependencies
    cmds:
      - uv sync --all-extras --upgrade
      - pnpm update

  clean:dev-data:
    desc: Remove disposable local runtime data (use CLI_ARGS=--include-artifacts for caches)
    cmds:
      - uv run python scripts/clean_dev_data.py --apply --yes {{.CLI_ARGS}}

  check:
    desc: Run all static checks (lint + format + markdown + type check)
    cmds:
      - uv run -m ruff check . --output-format=github
      - uv run -m ruff format --check .
      - pnpm exec markdownlint-cli2
      - pnpm turbo run lint --log-order=stream
      - uv run -m pyright
      - uv run -m ty check --output-format github
      - pnpm turbo run check-types

  test:
    desc: Run all tests (Python + Docs)
    cmds:
      - uv run -m pytest -n auto --dist=worksteal --capture=sys {{.CLI_ARGS}}
      - pnpm --filter docs test

  format:
    desc: Format all code
    cmds:
      - uv run -m ruff format .
      - pnpm exec prettier --write "apps/docs/src/**/*.{ts,tsx,css,json}"
      - pnpm exec markdownlint-cli2 --fix

  fix:
    desc: Auto-fix all linting and type issues
    cmds:
      - uv run -m ruff check --fix .
      - uv run -m ruff format .
      - pnpm exec prettier --write "apps/docs/src/**/*.{ts,tsx,css,json}"
      - uv run -m ty check --fix .
      - pnpm exec markdownlint-cli2 --fix

  build:
    desc: Build all workspaces
    cmds:
      - pnpm turbo run build

  ci:
    desc: Run the full local CI sequence
    cmds:
      - task: ci:hooks
      - task: check
      - task: test
      - task: build

  hooks:validate:
    desc: Validate Prek hook configuration
    cmds:
      - uv run prek validate-config prek.toml

  hooks:staged:
    desc: Run staged-file Git hooks via Prek
    cmds:
      - task: hooks:validate
      - uv run prek run --config prek.toml --stage pre-commit

  ci:hooks:
    desc: "[CI] Validate and run Git hooks on all tracked files"
    cmds:
      - task: hooks:validate
      - uv run prek run --config prek.toml --all-files

  ci:static:
    desc: "[CI] Static analysis checks"
    cmds:
      - uv run -m ruff check . --output-format=github
      - uv run -m ruff format --check .
      - pnpm exec markdownlint-cli2
      - pnpm turbo run lint

  ci:typecheck:
    desc: "[CI] Type checks"
    cmds:
      - uv run -m pyright
      - uv run -m ty check --output-format github
      - pnpm turbo run check-types

  ci:test:
    desc: "[CI] Tests with report output"
    cmds:
      - uv run -m pytest -n auto --dist=worksteal --capture=sys --junitxml=test-results/pytest.xml
      - pnpm --filter docs test

  ci:fix:
    desc: "[CI] Auto-fix and format"
    cmds:
      - uv run -m ruff check --fix .
      - uv run -m ruff format .
      - pnpm exec prettier --write "apps/docs/src/**/*.{ts,tsx,css,json}"
      - uv run -m ty check --fix .
      - pnpm exec markdownlint-cli2 --fix

  ci:wheel-smoke:
    desc: "[CI] Verify wheel contents"
    cmds:
      - uv run --locked python scripts/ci_verify_wheel.py

  ci:build:
    desc: "[CI] Build distribution artifacts"
    cmds:
      - uv build --clear --no-sources
      - task: ci:wheel-smoke
      - pnpm turbo run build

  ci:docs:
    desc: "[CI] Docs-only check, test and build (no Python toolchain required)"
    cmds:
      - pnpm --filter docs lint
      - pnpm --filter docs test
      - pnpm --filter docs check-types
      - pnpm --filter docs build

  smoke:
    desc: Run the smoke test suite locally with Docker Compose
    cmds:
      - docker compose --profile smoke up --build --abort-on-container-exit smoke-test

  ci:smoke:
    desc: "[CI] Run smoke tests and emit a JUnit XML report"
    cmds:
      - mkdir -p test-results/smoke
      - docker compose --profile smoke run --rm --build --user root -v ./test-results/smoke:/reports -e SMOKE_TEST_RESULTS_XML=/reports/smoke-test-results.xml smoke-test

  ci:version:derive-bump:
    desc: "[CI] Derive BUMP_LEVEL + BUMP_PRERELEASE from a branch name or dispatch input (single source of truth)"
    requires:
      vars: [SOURCE]
    cmds:
      - |
        set -euo pipefail
        # Delegate the actual mapping to scripts/ci_derive_bump.py so the
        # release.yml, ci-builds.yml, release:prepare, and release:notes all
        # agree on the same seven bumps. This task is the only wrapper that
        # knows whether to emit GitHub Actions outputs (CI) or stdout (local).
        output="$(uv run --no-sync python scripts/ci_derive_bump.py "{{.SOURCE}}")"
        # Re-parse via Python to keep the wrapper portable (no `sed` / `awk`
        # assumption on Windows / minimal CI images). Output format is
        # `<level>|<prerelease>` so consumers can split on a single delimiter.
        parsed="$(uv run --no-sync python -c "import sys; lines=[l.strip() for l in sys.stdin if l.strip()]; kv=dict(line.split('=',1) for line in lines); print(f\"{kv.get('bump_level','')}|{kv.get('bump_prerelease','')}\")" <<< "$output")"
        bump_level="${parsed%%|*}"
        bump_prerelease="${parsed##*|}"
        if [ -z "$bump_level" ] || [ -z "$bump_prerelease" ] || [[ "$parsed" != *"|"* ]]; then
          echo "ci_derive_bump.py returned no level/prerelease for {{.SOURCE}}" >&2
          echo "$output" >&2
          exit 1
        fi
        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          {
            echo "bump_level=$bump_level"
            echo "bump_prerelease=$bump_prerelease"
          } >> "$GITHUB_OUTPUT"
        else
          # Local callers (release:prepare, release:notes) split on `|`.
          echo "${bump_level}|${bump_prerelease}"
        fi

  ci:version:bump:
    desc: "[CI] Bump development version and emit GitHub Actions outputs"
    vars:
      # `default` filters (not static values) so CLI `VAR=value` overrides
      # win; a static default like `BUMP_LEVEL: patch` shadows the CLI input
      # in Task >= 3.52 and broke stable/alpha/beta/rc bumps (always dev).
      BUMP_LEVEL: '{{.BUMP_LEVEL | default "patch"}}'
      BUMP_PRERELEASE: '{{.BUMP_PRERELEASE | default "dev"}}'
      DRY_RUN: '{{.DRY_RUN | default "false"}}'
    cmds:
      - |
        set -euo pipefail
        bump_level="{{.BUMP_LEVEL}}"
        bump_prerelease="{{.BUMP_PRERELEASE}}"

        # Sync version from latest remote tag so the version advances across runs.
        # PEP 440 ordering (not `git tag --sort=-v:refname`, which ranks
        # v0.4.1.dev7 above v0.4.1) so the bump bases off the true latest tag.
        git fetch --tags --quiet
        latest_tag="$(uv run python scripts/ci_latest_tag.py)"
        if [ -n "$latest_tag" ]; then
          tag_version="${latest_tag#v}"
          uv version "$tag_version" --frozen
        fi

        # Determine bump strategy:
        # - release tags need <level>+<prerelease> (e.g. --bump patch --bump beta)
        # - dev pre-releases of the same (patch) cycle just bump the pre-release (e.g. --bump dev)
        # - pre-releases of a different class need <level>+<prerelease> (e.g. --bump minor --bump dev)
        # - stable clears the pre-release component
        if [ "$bump_prerelease" = "stable" ]; then
          set -- --bump stable
        elif [ -n "$latest_tag" ] && [[ "$tag_version" != *dev* ]] && [[ "$tag_version" != *a* ]] && [[ "$tag_version" != *b* ]] && [[ "$tag_version" != *rc* ]]; then
          # Latest tag is a stable release — must bump level + prerelease
          set -- --bump "$bump_level" --bump "$bump_prerelease"
        elif [ "$bump_level" = "patch" ] && [ "$bump_prerelease" = "dev" ]; then
          # Latest tag is a dev pre-release of the same (patch) cycle — continue it
          set -- --bump dev
        else
          # Latest tag is a pre-release of a different class — start a new cycle
          set -- --bump "$bump_level" --bump "$bump_prerelease"
        fi

        version_json="$(uv version "$@" --output-format json --frozen)"
        new_version="$(python -c 'import json, sys; print(json.load(sys.stdin)["version"])' <<< "$version_json")"

        if [ "{{.DRY_RUN}}" = "true" ]; then
          # Revert any pyproject.toml mutation performed by `uv version` so
          # the working tree stays clean for callers that only need the
          # version string (release:prepare / release:notes).
          git checkout -- pyproject.toml
          echo "$new_version"
          exit 0
        fi

        echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
        echo "$version_json"
        echo "Bumping version to: $new_version (level: $bump_level, prerelease: $bump_prerelease)"

  ci:version:precheck:
    desc: "[CI] Pre-bump validation: verify new version is valid and greater than all existing tags"
    requires:
      vars: [NEW_VERSION]
    env:
      NEW_VERSION: "{{.NEW_VERSION}}"
    cmds:
      - |
        set -euo pipefail
        uv run python scripts/ci_version_precheck.py

  ci:version:postcheck:
    desc: "[CI] Post-bump validation: verify version is synchronized and valid"
    requires:
      vars: [VERSION]
    env:
      VERSION: "{{.VERSION}}"
    cmds:
      - task: release:verify-version
        vars:
          VERSION: "{{.VERSION}}"
      - |
        set -euo pipefail
        uv run python scripts/ci_version_postcheck.py

  ci:version:write-config:
    desc: "[CI] Write version into config.py and package.json"
    requires:
      vars: [VERSION, CONFIG_PATH]
    env:
      VERSION: "{{.VERSION}}"
      CONFIG_PATH: "{{.CONFIG_PATH}}"
    cmds:
      - |
        set -euo pipefail
        python scripts/ci_version_write.py

  ci:version:tag-only:
    desc: "[CI] Create release tag only (no commit push to avoid branch divergence)"
    requires:
      vars: [VERSION]
    cmds:
      - |
        set -euo pipefail

        version="{{.VERSION}}"
        tag="v${version}"

        if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists locally; skipping tag creation."
        elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin; skipping tag creation."
        else
            git tag "$tag"
            git push origin "$tag"
        fi

  ci:version:from-tag:
    desc: "[CI] Restore version from a git tag into config.py (for release builds)"
    requires:
      vars: [TAG, CONFIG_PATH]
    cmds:
      - |
        set -euo pipefail

        version="{{.TAG}}"
        version="${version#v}"

        export VERSION="$version" CONFIG_PATH="{{.CONFIG_PATH}}"
        python scripts/ci_version_from_tag.py

  _ci:version:read:
    desc: Read the current pyproject version (no mutation); used by release:prepare / release:notes
    cmds:
      - |
        set -euo pipefail
        uv version --short --frozen

  release:verify-version:
    desc: Verify release version is synchronized across package files
    requires:
      vars: [VERSION]
    env:
      VERSION: "{{.VERSION}}"
    cmds:
      - |
        set -euo pipefail
        python scripts/release_verify_version.py

  release:prepare:
    desc: Scaffold release notes for a bump (version is derived by the workflow via uv — no local version write)
    requires:
      vars: [BUMP]
    cmds:
      - |
        set -euo pipefail
        bump="{{.BUMP}}"

        # Delegate bump -> level/prerelease mapping to ci:version:derive-bump,
        # which is the single source of truth (also called by release.yml and
        # ci-builds.yml). Local invocation just prints the two values.
        derived="$(task -s ci:version:derive-bump SOURCE="${bump}")"
        bump_level="${derived%%|*}"
        bump_prerelease="${derived##*|}"
        if [ -z "$bump_level" ] || [ -z "$bump_prerelease" ] || [[ "$derived" != *"|"* ]]; then
          echo "Invalid bump: $bump (expected major|minor|patch|stable|alpha|beta|rc)" >&2
          exit 1
        fi

        # Preview the version the workflow will derive via `uv version` from the
        # latest tag (DRY_RUN keeps pyproject.toml untouched). The workflow is
        # the single authority — the developer never writes version files.
        new_version="$(task ci:version:bump BUMP_LEVEL="$bump_level" BUMP_PRERELEASE="$bump_prerelease" DRY_RUN=true | tail -n1)"
        new_version="$(printf '%s' "$new_version" | tr -d '\r')"

        # Scaffold the release notes file (only if missing) so the
        # developer can edit it before pushing.
        notes_path=".github/releases/${new_version}.md"
        if [ ! -f "$notes_path" ]; then
          printf '# Lingchu Bot %s\n\nRelease notes for %s.\n' "$new_version" "$new_version" > "$notes_path"
          echo "Scaffolded ${notes_path}; edit and commit before triggering."
        else
          echo "Reusing existing ${notes_path}."
        fi

        echo "Expected release version: ${new_version} (derived by release.yml via uv)."
        echo "Next: edit ${notes_path} + update CHANGELOG.md, git add + commit + push main, then run task release:publish BUMP=${bump}."

  release:publish:
    desc: Trigger the release workflow manually (gh workflow run with the bump input)
    requires:
      vars: [BUMP]
    cmds:
      - gh workflow run release.yml -f "bump={{.BUMP}}"

  release:notes:
    desc: Scaffold the release notes file for a bump (BUMP var or current releases/<bump> branch)
    vars:
      BUMP: '{{.BUMP | default ""}}'
    cmds:
      - |
        set -euo pipefail
        bump="{{.BUMP}}"
        if [ -z "$bump" ]; then
          current_branch="${GITHUB_REF_NAME:-$(git branch --show-current)}"
          case "$current_branch" in
            releases/major|releases/minor|releases/patch|releases/stable|releases/alpha|releases/beta|releases/rc) ;;
            *) echo "Pass BUMP=... (or run from a releases/<bump> branch) to scaffold release notes." >&2; exit 1 ;;
          esac
          bump="${current_branch#releases/}"
        fi

        # Delegate bump -> level/prerelease mapping to ci:version:derive-bump
        # (single source of truth, shared with release.yml / ci-builds.yml).
        derived="$(task -s ci:version:derive-bump SOURCE="${bump}")"
        bump_level="${derived%%|*}"
        bump_prerelease="${derived##*|}"
        if [ -z "$bump_level" ] || [ -z "$bump_prerelease" ] || [[ "$derived" != *"|"* ]]; then
          echo "ci:version:derive-bump returned no level/prerelease for ${bump}" >&2
          exit 1
        fi

        new_version="$(task ci:version:bump BUMP_LEVEL="$bump_level" BUMP_PRERELEASE="$bump_prerelease" DRY_RUN=true | tail -n1)"
        new_version="$(printf '%s' "$new_version" | tr -d '\r')"
        notes_path=".github/releases/${new_version}.md"
        if [ -f "$notes_path" ]; then
          echo "Notes file already exists: ${notes_path}"
        else
          printf '# Lingchu Bot %s\n\nRelease notes for %s.\n' "$new_version" "$new_version" > "$notes_path"
          echo "Created ${notes_path}; edit and commit."
        fi

  i18n:
    desc: Extract, update and compile i18n messages
    cmds:
      - uv run pybabel extract -F src/plugins/nonebot_plugin_lingchu_bot/i18n/babel.cfg -o src/plugins/nonebot_plugin_lingchu_bot/i18n/messages.pot src/plugins/nonebot_plugin_lingchu_bot
      - uv run pybabel update -i src/plugins/nonebot_plugin_lingchu_bot/i18n/messages.pot -d src/plugins/nonebot_plugin_lingchu_bot/i18n/locales -D messages
      - uv run pybabel compile -d src/plugins/nonebot_plugin_lingchu_bot/i18n/locales -D messages

  db:revision:
    desc: 基于 ORM 模型变更自动生成迁移脚本（autogenerate，输出到插件 migrations 目录）
    preconditions:
      - sh: test -n "{{.MSG}}"
        msg: 'MSG 参数必填，用法: task db:revision -- MSG="描述变更"'
    cmds:
      - ENVIRONMENT=dev uv run lc db revision -m "{{.MSG}}" --branch-label nonebot_plugin_lingchu_bot

  db:check:
    desc: 检查是否有未应用的数据库迁移
    cmds:
      - ENVIRONMENT=dev uv run lc db check

  db:upgrade:
    desc: 应用待执行的数据库迁移
    cmds:
      - ENVIRONMENT=dev uv run lc db upgrade

  gitmoji:
    desc: 显示 gitmoji + Conventional Commits 中文速查表
    cmds:
      - |
        cat <<'EOF'
        ╔══════════════════════════════════════════════════════════════╗
        ║            gitmoji + Conventional Commits 速查表            ║
        ╠══════════════════════════════════════════════════════════════╣
        ║  格式: <gitmoji> <type>(<scope>)?: <subject>                ║
        ║  示例: ✨ feat: 新增功能                                    ║
        ║        🐛 fix(auth): 修复令牌过期                           ║
        ╠══════════════════════════════════════════════════════════════╣
        ║  Emoji  Type        说明                                   ║
        ╠══════════════════════════════════════════════════════════════╣
        ║  ✨     feat        引入新功能                              ║
        ║  🐛     fix         修复缺陷                                ║
        ║  📝     docs        新增或更新文档                          ║
        ║  🎨     style       改善代码结构/格式(不影响逻辑)           ║
        ║  ♻️     refactor    重构代码(既非新功能也非修缺陷)          ║
        ║  ⚡️     perf        提升性能                                ║
        ║  ✅     test        新增、更新或通过测试                    ║
        ║  👷     build       新增或更新 CI 构建系统                  ║
        ║  💚     ci          修复 CI 构建                           ║
        ║  🔧     chore       新增或更新配置文件                      ║
        ║  ⏪️     revert      回退变更                                ║
        ╠══════════════════════════════════════════════════════════════╣
        ║  其他常用 gitmoji                                           ║
        ╠══════════════════════════════════════════════════════════════╣
        ║  🚑️     紧急修复(热补丁)                                   ║
        ║  🚀     部署相关                                            ║
        ║  💄     新增或更新 UI 和样式文件                            ║
        ║  🎉     初始化项目                                          ║
        ║  🔒️     修复安全或隐私问题                                  ║
        ║  🔐     新增或更新密钥                                      ║
        ║  🔖     发布/版本标签                                       ║
        ║  🚨     修复编译器/linter 警告                              ║
        ║  🚧     工作进行中                                          ║
        ║  ⬇️     降级依赖                                            ║
        ║  ⬆️     升级依赖                                            ║
        ║  📌     锁定依赖到特定版本                                  ║
        ║  📈     新增或更新分析/追踪代码                             ║
        ║  ➕     新增依赖                                            ║
        ║  ➖     移除依赖                                            ║
        ║  🔨     新增或更新开发脚本                                  ║
        ║  🌐     国际化与本地化                                      ║
        ║  ✏️     修复拼写错误                                        ║
        ║  💩     编写需要改进的劣质代码                              ║
        ║  🔀     合并分支                                            ║
        ║  📦️     新增或更新编译文件或包                               ║
        ║  👽️     因外部 API 变更而更新代码                           ║
